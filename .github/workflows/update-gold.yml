name: Auto Update Gold Prices

on:
  schedule:
    # Tối ưu: Chạy mỗi 2 tiếng, từ 8h sáng đến 18h tối (Giờ VN = 1h đến 11h UTC), từ Thứ 2 đến Thứ 7
    - cron: '0 1,3,5,7,9,11 * * 1-6'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python crawl_gold.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # BƯỚC 1: Đổi tên và cất file JSON mới cào được vào vùng an toàn
          mv gold-prices.json gold-prices-new.json
          
          # BƯỚC 2: Xóa sạch rác và ép đồng bộ mới nhất từ Github về (Cam kết 100% không Conflict)
          git reset --hard
          git pull origin main
          
          # BƯỚC 3: Mang file JSON mới giấu ra và chèn đè lên file cũ của Github
          mv gold-prices-new.json gold-prices.json
          
          # BƯỚC 4: Đẩy dữ liệu sạch lên Github
          git add gold-prices.json
          if ! git diff --staged --quiet; then
            git commit -m "Cập nhật giá vàng tự động [skip ci]"
            git push origin main
          fi