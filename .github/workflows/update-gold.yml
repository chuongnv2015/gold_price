name: Auto Update Gold Prices

on:
  schedule:
    # Tối ưu: Chạy mỗi 2 tiếng, từ 8h sáng đến 18h tối (Giờ VN = 1h đến 11h UTC), từ Thứ 2 đến Thứ 7
    # Không chạy vào ban đêm và Chủ nhật vì giá vàng lúc đó không biến động, tiết kiệm số phút Github Actions
    - cron: '0 1,3,5,7,9,11 * * 1-6'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python crawl_gold.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold-prices.json
          
          # Kiểm tra nếu file có thay đổi thì mới tiến hành lưu
          if ! git diff --staged --quiet; then
            git commit -m "Cập nhật giá vàng tự động [skip ci]"
            # Bắt buộc kéo code mới nhất từ kho về để gộp (tránh lỗi rejected)
            git pull --rebase origin main
            # Đẩy lên lại kho
            git push origin main
          fi