
name: Auto Update Gold Prices

on:
  schedule:
    - cron: '0 1,3,5,7,9,11 * * 1-6'
  workflow_dispatch:

# Tránh nhiều lần chạy đồng thời
concurrency:
  group: gold-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Lấy code mới nhất từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. Cài đặt Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cài thư viện
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. Kiểm tra file Python
      - name: Check scraper file
        run: |
          echo "Danh sach file:"
          ls -la
          test -f crawl_gold.py

      # 5. Chạy chương trình crawl giá vàng
      - name: Run scraper script
        run: python -u crawl_gold.py

      # 6. Kiểm tra dữ liệu JSON
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json

          with open("gold-prices.json", encoding="utf-8") as f:
              data = json.load(f)

          assert "phu_quy" in data["prices"], "Thieu du lieu Phu Quy"
          assert "btmh" in data["prices"], "Thieu du lieu BTMH"

          target = [
              item for item in data["prices"]["phu_quy"]
              if item["type"] == "Vàng nguyên liệu 999,9"
          ]

          assert target, "KHONG TIM THAY V9999P"
          assert target[0]["buy"], "V9999P KHONG CO GIA MUA"

          print("KIEM TRA JSON THANH CONG")
          print("Thoi gian:", data["updated_at"])
          print("V9999P:", target[0])
          PY

      # 7. Commit và push JSON lên GitHub
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gold-prices.json

          if ! git diff --staged --quiet; then
            git commit -m "Cap nhat gia vang tu dong [skip ci]"
            git push origin main
            echo "Da cap nhat gold-prices.json"
          else
            echo "Gia vang khong thay doi."
          fi
