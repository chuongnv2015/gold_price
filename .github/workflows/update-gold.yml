name: Auto Update Gold Prices

on:
  schedule:
    - cron: '0 1,3,5,7,9,11 * * 1-6'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python crawl_gold.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Cất file JSON vừa cào được ra chỗ an toàn
          cp gold-prices.json gold-prices-new.json
          
          # 2. Ép máy chủ tải code mới nhất từ kho Github về, xóa bỏ mọi khác biệt (Chống Conflict tuyệt đối)
          git fetch origin main
          git reset --hard origin/main
          
          # 3. Lấy file JSON mới đè lên file cũ của kho
          mv gold-prices-new.json gold-prices.json
          
          # 4. Lưu và đẩy lên Github
          git add gold-prices.json
          if ! git diff --staged --quiet; then
            git commit -m "Cập nhật giá vàng tự động [skip ci]"
            git push origin main
          fi